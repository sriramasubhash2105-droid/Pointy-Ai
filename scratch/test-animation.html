<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background: #0f1117;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }

  .bubble-stage {
    position: fixed;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
  }

  .chat-speech-bubble {
    position: relative;
    display: inline-flex;
    flex-direction: column;
    background: linear-gradient(180deg, #fff2f4 0%, #fed8de 100%);
    border: 1px solid #7ea3c7;
    border-radius: 20px 20px 4px 20px;
    padding: 10px 18px;
    color: #1a1a1a;
    font-size: 14.5px;
    line-height: 1.48;
    font-weight: 400;
    max-width: 460px;
    min-width: 38px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22), 0 1px 4px rgba(0, 0, 0, 0.12);
    box-sizing: border-box;
    will-change: width, height;
    transition: width 0.06s ease-out, height 0.12s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .bubble-text-content {
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: break-word;
  }

  .bubble-tail-svg {
    position: absolute;
    bottom: -1px;
    right: -7px;
    width: 8px;
    height: 12px;
    overflow: visible;
    pointer-events: none;
  }

  .typing-cursor {
    display: inline-block;
    width: 1.8px;
    height: 14px;
    background: #1a1a1a;
    margin-left: 2px;
    vertical-align: -1.5px;
    animation: cursor-blink 0.75s infinite;
  }

  .typing-cursor.hidden {
    display: none !important;
  }

  @keyframes cursor-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* Optional minimalist View More toggle if extra details exist */
  .bubble-more-toggle {
    margin-top: 6px;
    align-self: flex-start;
    color: #3b628a;
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
    opacity: 0.85;
    transition: opacity 0.2s;
  }
  .bubble-more-toggle:hover {
    opacity: 1;
    color: #1a3b60;
  }

  .bubble-details-body {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed rgba(126, 163, 199, 0.5);
    font-size: 13px;
    line-height: 1.45;
    color: #222;
  }
</style>
</head>
<body>
  <div class="bubble-stage">
    <div id="speech-bubble" class="chat-speech-bubble">
      <div class="bubble-text-content">
        <span id="bubble-text"></span><span id="bubble-cursor" class="typing-cursor"></span>
      </div>
      <svg class="bubble-tail-svg" viewBox="0 0 8 12" fill="none">
        <path d="M0,0 C0.5,4 2.5,9.5 8,11.5 C4.5,11.5 1.5,9.5 0.2,6 Z" fill="#fed8de" />
        <path d="M0,12 C3,12 5.5,12 8,11.5 C4.5,11.5 1.5,9.5 0.2,6" stroke="#7ea3c7" stroke-width="1" />
        <line x1="0" y1="0" x2="0" y2="12" stroke="#fed8de" stroke-width="2" />
      </svg>
    </div>
  </div>

  <script>
    const fullText = "I found the Settings button in your top bar! Look right where I am pointing.";
    const textEl = document.getElementById('bubble-text');
    let idx = 0;

    function typeChar() {
      if (idx < fullText.length) {
        textEl.textContent += fullText[idx];
        idx++;
        setTimeout(typeChar, 32);
      }
    }
    typeChar();
  </script>
</body>
</html>
