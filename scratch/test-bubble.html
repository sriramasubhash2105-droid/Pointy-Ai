<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    padding: 60px;
    background: #0f1117;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  .scene {
    position: relative;
    width: 600px;
    height: 300px;
  }

  /* Pointy Red AI Cursor (26px) */
  .pointy-cursor {
    position: absolute;
    left: 80px;
    top: 90px;
    width: 26px;
    height: 26px;
    filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.5)) drop-shadow(0 0 6px rgba(255, 23, 68, 0.45));
  }

  /* Speech bubble anchored to Pointy */
  .speech-bubble-wrapper {
    position: absolute;
    left: 110px;
    top: 78px;
    display: inline-flex;
    align-items: flex-start;
  }

  .chat-speech-bubble {
    position: relative;
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
    background: linear-gradient(180deg, #ff2247 0%, #d50000 100%);
    border: 1px solid rgba(140, 195, 255, 0.65);
    border-radius: 18px 18px 4px 18px;
    padding: 8px 15px;
    color: #ffffff;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14.5px;
    line-height: 1.45;
    font-weight: 500;
    max-width: 440px;
    min-width: 32px;
    box-shadow: 0 6px 22px rgba(213, 0, 0, 0.35), 0 2px 8px rgba(0, 0, 0, 0.35);
    box-sizing: border-box;
    will-change: width, height;
    transition: width 0.05s ease-out, height 0.12s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .bubble-text-content {
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: break-word;
    color: #ffffff;
    font-size: 14.5px;
    line-height: 1.45;
    font-weight: 500;
    text-align: left;
    width: 100%;
  }

  .bubble-tail-svg {
    position: absolute;
    bottom: -1px;
    right: -7px;
    width: 8px;
    height: 12px;
    overflow: visible;
    pointer-events: none;
  }

  .typing-cursor {
    display: inline-block;
    width: 2px;
    height: 15px;
    background: #ffffff;
    margin-left: 2px;
    vertical-align: -2px;
    animation: cursor-blink 0.75s infinite;
  }

  @keyframes cursor-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
</style>
</head>
<body>
  <div class="scene">
    <!-- Red Pointy Cursor Graphic -->
    <div class="pointy-cursor">
      <svg viewBox="0 0 512 512" width="26" height="26">
        <path d="M 71,1 L 461,328 L 209,313 L 49,510 Z" fill="#e21b1b" />
      </svg>
    </div>

    <!-- Red Speech Bubble right beside Pointy -->
    <div class="speech-bubble-wrapper">
      <div class="chat-speech-bubble">
        <div class="bubble-text-content"><span id="bubble-text">I found the Settings button in your top bar!</span><span class="typing-cursor"></span></div>
        <svg class="bubble-tail-svg" viewBox="0 0 8 12" fill="none">
          <path d="M0,0 C0.5,4 2.5,9.5 8,11.5 C4.5,11.5 1.5,9.5 0.2,6 Z" fill="#d50000" />
          <path d="M0,12 C3,12 5.5,12 8,11.5 C4.5,11.5 1.5,9.5 0.2,6" stroke="rgba(140, 195, 255, 0.65)" stroke-width="1" />
          <line x1="0" y1="0" x2="0" y2="12" stroke="#d50000" stroke-width="2" />
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
