<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pointy AI - Spatial Red Cursor</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <!-- Red AI Cursor (Natural 26px Cursor Size) -->
  <div id="ai-cursor" class="ai-cursor idle">
    <!-- User's Exact Red Cursor SVG (26px natural cursor size) -->
    <div class="cursor-graphic" title="Pointy AI Companion — Press Alt+C to speak, Alt+T to type">
      <svg viewBox="0 0 512 512" width="26" height="26" class="cursor-svg">
        <path d="M 71,1 L 461,328 L 209,313 L 49,510 Z" fill="#e21b1b" />
      </svg>
    </div>

    <!-- Pop-out ripple shockwave effect -->
    <div id="cursor-shockwave" class="cursor-shockwave"></div>

    <!-- Sleek Loading Spinner (Appears INSTEAD of red cursor while processing) -->
    <div id="cursor-loading-spinner" class="cursor-loading-spinner hidden">
      <div class="spinner-ring"></div>
      <div class="spinner-core"></div>
    </div>

    <!-- Quick Action Menu on Hover (When idle in corner) -->
    <div id="cursor-hover-menu" class="cursor-hover-menu">
      <button id="btn-quick-voice" class="quick-action-btn" title="Ask with Voice (Alt+C / F8)">
        <span class="quick-icon">🎙️</span>
        <span class="quick-label">Speak</span>
      </button>
      <button id="btn-quick-type" class="quick-action-btn" title="Type a Question (Alt+T)">
        <span class="quick-icon">⌨️</span>
        <span class="quick-label">Type</span>
      </button>
    </div>

  </div>

  <!-- Minimalist Light-Red Outgoing Speech Bubble (Centered slightly above midpoint) -->
  <div id="cursor-answer-card" class="speech-bubble-wrapper hidden">
    <div id="speech-bubble" class="chat-speech-bubble">
      <div id="bubble-text-content" class="bubble-text-content"><span id="bubble-text"></span><span id="bubble-cursor" class="typing-cursor"></span></div>

      <!-- Adaptive outgoing tail: points towards Pointy whether on left or right -->
      <svg id="bubble-tail-right" class="bubble-tail-svg tail-right" viewBox="0 0 8 12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,0 C0.5,4 2.5,9.5 8,11.5 C4.5,11.5 1.5,9.5 0.2,6 Z" fill="rgba(195, 0, 0, 0.82)" />
        <path d="M0,12 C3,12 5.5,12 8,11.5 C4.5,11.5 1.5,9.5 0.2,6" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1" />
        <line x1="0" y1="0" x2="0" y2="12" stroke="rgba(195, 0, 0, 0.82)" stroke-width="2" />
      </svg>
      <svg id="bubble-tail-left" class="bubble-tail-svg tail-left" viewBox="0 0 8 12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8,0 C7.5,4 5.5,9.5 0,11.5 C3.5,11.5 6.5,9.5 7.8,6 Z" fill="rgba(195, 0, 0, 0.82)" />
        <path d="M8,12 C5,12 2.5,12 0,11.5 C3.5,11.5 6.5,9.5 7.8,6" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1" />
        <line x1="8" y1="0" x2="8" y2="12" stroke="rgba(195, 0, 0, 0.82)" stroke-width="2" />
      </svg>

      <!-- Optional minimalist View Details toggle -->
      <div id="bubble-details-container" class="bubble-details-container hidden">
        <div id="bubble-details-toggle" class="bubble-details-toggle" role="button">view full details ▾</div>
        <div id="bubble-details-body" class="bubble-details-body collapsed"></div>
      </div>

      <!-- Quick chat actions: Continue chat / New chat -->
      <div id="bubble-actions" class="bubble-actions hidden">
        <button id="bubble-btn-continue" class="bubble-action-btn" title="Continue conversation">
          <span class="bubble-action-icon">💬</span> Continue chat
        </button>
        <button id="bubble-btn-new" class="bubble-action-btn" title="Start a fresh new conversation">
          <span class="bubble-action-icon">✨</span> New chat
        </button>
      </div>

      <!-- Inline reply bar for continuing or starting new chat -->
      <div id="bubble-reply-bar" class="bubble-reply-bar hidden">
        <input type="text" id="bubble-reply-input" class="bubble-reply-input" placeholder="Ask a follow-up..." autocomplete="off" />
        <button id="bubble-reply-mic" class="bubble-reply-btn mic" title="Speak question (Alt+C / F8)">🎙️</button>
        <button id="bubble-reply-send" class="bubble-reply-btn send" title="Send (Enter)">→</button>
      </div>
    </div>

    <!-- Hidden elements kept for legacy code safety -->
    <div id="chat-stream" style="display:none"></div>
    <div id="answer-card-text" style="display:none"></div>
    <div id="badge-title" style="display:none"></div>
    <div id="btn-new-chat" style="display:none"></div>
    <button id="answer-close-btn" style="display:none"></button>
    <button id="answer-next-btn" style="display:none"></button>
    <button id="answer-skip-btn" style="display:none"></button>
    <div id="card-input-bar" style="display:none">
      <input type="text" id="card-chat-input" style="display:none" />
      <button id="card-chat-mic" style="display:none"></button>
      <button id="card-chat-send" style="display:none"></button>
    </div>
    <div id="answer-card-footer" style="display:none">
      <span id="answer-step-info"></span>
    </div>
    <div id="card-resize-handle" style="display:none"></div>
  </div>



  <!-- Text Input fallback (Double-click or press Enter to type) -->
  <div id="text-input-container" class="text-input-container hidden">
    <div class="input-wrapper">
      <span class="input-icon">🎯</span>
      <input type="text" id="text-input" placeholder="Type your question (or speak with Alt+C / F8)..." autocomplete="off">
      <button id="text-submit" class="input-submit">→</button>
    </div>
  </div>

  <!-- Particles container -->
  <div id="particles" class="particles"></div>

  <script src="overlay.js"></script>
</body>
</html>
