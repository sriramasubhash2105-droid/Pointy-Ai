<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pointy AI Overlay</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <!-- Buddy Mascot -->
  <div id="buddy" class="buddy idle">
    <div class="buddy-body">
      <div class="buddy-face">
        <div class="buddy-eye left"></div>
        <div class="buddy-eye right"></div>
        <div class="buddy-mouth"></div>
      </div>
      <div class="buddy-glow"></div>
    </div>
    <div class="buddy-trail"></div>
  </div>

  <!-- Pointing Cursor -->
  <div id="pointer" class="pointer hidden">
    <svg viewBox="0 0 40 40" width="40" height="40">
      <defs>
        <linearGradient id="pointer-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
        </linearGradient>
        <filter id="pointer-glow">
          <feGaussianBlur stdDeviation="2" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <path d="M8 4 L8 32 L16 24 L26 34 L30 30 L20 20 L28 16 Z" 
            fill="url(#pointer-gradient)" 
            stroke="white" 
            stroke-width="1.5"
            filter="url(#pointer-glow)"/>
    </svg>
  </div>

  <!-- Target Ring (appears around pointed element) -->
  <div id="target-ring" class="target-ring hidden">
    <div class="ring-inner"></div>
    <div class="ring-pulse"></div>
    <div class="ring-label">
      <span id="ring-label-text"></span>
    </div>
  </div>

  <!-- Status Panel -->
  <div id="status-panel" class="status-panel hidden">
    <div class="status-icon"></div>
    <div class="status-text" id="status-text">Ready</div>
  </div>

  <!-- Caption Bar (for spoken text) -->
  <div id="caption-bar" class="caption-bar hidden">
    <div class="caption-content">
      <span class="caption-icon">💬</span>
      <span id="caption-text"></span>
    </div>
  </div>

  <!-- Transcript display -->
  <div id="transcript-display" class="transcript-display hidden">
    <span class="transcript-icon">🎤</span>
    <span id="transcript-text"></span>
  </div>

  <!-- Text Input (alternative to voice) -->
  <div id="text-input-container" class="text-input-container hidden">
    <div class="input-wrapper">
      <span class="input-icon">🎯</span>
      <input type="text" id="text-input" placeholder="Ask Pointy anything..." autocomplete="off">
      <button id="text-submit" class="input-submit">→</button>
    </div>
  </div>

  <!-- Step Counter -->
  <div id="step-counter" class="step-counter hidden">
    <span id="step-current">1</span> of <span id="step-total">1</span>
    <button id="step-next" class="step-btn">Next →</button>
    <button id="step-skip" class="step-btn secondary">Skip</button>
  </div>

  <!-- Particle effects container -->
  <div id="particles" class="particles"></div>

  <script src="overlay.js"></script>
</body>
</html>
